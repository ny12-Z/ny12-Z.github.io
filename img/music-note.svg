<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Music">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63c0f8"/>
      <stop offset="1" stop-color="#2f8fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".62">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- 双八分音符：两个符头 + 两条符干 + 一条符杠。
       放大到约 65% 宽度是刻意的：APlayer 会在封面正中叠一个播放按钮，
       音符太小会被整个盖住，放大后按钮压在中间、音符从四周露出来才看得出来。 -->
  <g fill="#fff" opacity=".95" transform="translate(200 200) scale(3.6) translate(-54.5 -51)">
    <ellipse cx="32" cy="74" rx="13.5" ry="10" transform="rotate(-22 32 74)"/>
    <ellipse cx="74" cy="66" rx="13.5" ry="10" transform="rotate(-22 74 66)"/>
    <rect x="43" y="26" width="5.5" height="48" rx="2.7"/>
    <rect x="85" y="18" width="5.5" height="48" rx="2.7"/>
    <path d="M43 26 L90.5 18 L90.5 31.5 L43 39.5 Z"/>
  </g>
</svg>
